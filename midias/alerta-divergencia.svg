<svg viewBox="0 0 526 360" xmlns="http://www.w3.org/2000/svg" width="526" height="360" role="img">
  <title>Alerta de Divergência ConcliX</title>

  <defs>
    <clipPath id="card-clip">
      <rect x="48" y="24" width="430" height="312" rx="14"/>
    </clipPath>
  </defs>

  <!-- Fundo -->
  <rect width="526" height="360" fill="#1A1020"/>

  <!-- Sombra do card -->
  <rect x="51" y="28" width="430" height="312" rx="14" fill="rgba(0,0,0,0.45)"/>

  <!-- Card principal -->
  <rect x="48" y="24" width="430" height="312" rx="14" fill="#2F2235"/>
  <rect x="48" y="24" width="430" height="312" rx="14" fill="none" stroke="#4A3D52" stroke-width="1"/>

  <!-- Cabeçalho vermelho (clipped para respeitar cantos arredondados) -->
  <rect x="48" y="24" width="430" height="62" fill="#3A1A1A" clip-path="url(#card-clip)"/>

  <!-- Ícone de aviso + textos do cabeçalho -->
  <text x="76" y="58" font-family="Arial, sans-serif" font-size="18" fill="#E06060">⚠</text>
  <text x="104" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E06060" letter-spacing="0.5">ALERTA DE DIVERGÊNCIA</text>
  <text x="104" y="67" font-family="Arial, sans-serif" font-size="9" fill="rgba(224,96,96,0.55)">Mercado Livre — Pedido #ML-48821 — 14/06/2026</text>

  <!-- Divisor do cabeçalho -->
  <line x1="48" y1="86" x2="478" y2="86" stroke="#4A3D52" stroke-width="1"/>

  <!-- ── Valores ── -->
  <!-- Esperado -->
  <text x="82" y="112" font-family="Arial, sans-serif" font-size="8.5" fill="rgba(191,195,186,0.38)" letter-spacing="1">VALOR ESPERADO</text>
  <text x="82" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#BFC3BA">R$ 1.500,00</text>

  <!-- Divisor vertical -->
  <line x1="290" y1="94" x2="290" y2="155" stroke="#4A3D52" stroke-width="1"/>

  <!-- Recebido -->
  <text x="310" y="112" font-family="Arial, sans-serif" font-size="8.5" fill="rgba(191,195,186,0.38)" letter-spacing="1">VALOR RECEBIDO</text>
  <text x="310" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#BFC3BA">R$ 1.200,00</text>

  <!-- Divisor horizontal tracejado -->
  <line x1="72" y1="160" x2="456" y2="160" stroke="rgba(74,61,82,0.55)" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- ── Caixa de divergência ── -->
  <rect x="72" y="172" width="384" height="76" rx="10" fill="rgba(180,75,75,0.1)" stroke="rgba(180,75,75,0.3)" stroke-width="1"/>

  <text x="96" y="196" font-family="Arial, sans-serif" font-size="8.5" fill="rgba(224,96,96,0.6)" letter-spacing="1">DIVERGÊNCIA IDENTIFICADA</text>
  <text x="96" y="228" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#E06060">− R$ 300,00</text>

  <!-- Badge de alerta -->
  <rect x="362" y="182" width="82" height="22" rx="6" fill="rgba(180,75,75,0.25)"/>
  <text x="403" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E06060">⚠ ALERTA</text>

  <!-- Divisor dos botões -->
  <line x1="48" y1="264" x2="478" y2="264" stroke="#4A3D52" stroke-width="1"/>

  <!-- ── Botões ── -->
  <rect x="72" y="276" width="110" height="38" rx="8" fill="rgba(63,50,68,0.5)" stroke="#60495A" stroke-width="1"/>
  <text x="127" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(191,195,186,0.5)">Ignorar</text>

  <rect x="204" y="276" width="252" height="38" rx="8" fill="#60495A"/>
  <text x="330" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#BFC3BA">Contestar Repasse →</text>
</svg>
